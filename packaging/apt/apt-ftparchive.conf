// Fields for the generated dists/<suite>/Release file.
//
// apt-ftparchive will not invent Suite, Components or Architectures, and apt rejects a
// Release file that omits them — the failure reads as "Malformed entry" or an
// unexplained "Skipping acquire", so it is worth keeping them in one reviewable place.
APT::FTPArchive::Release {
  Origin "LLM Gateway";
  Label "LLM Gateway";
  Suite "stable";
  Codename "stable";
  Architectures "amd64";
  Components "main";
  Description "LLM Gateway desktop app for Claude Code";
};

// Emit only the digests apt still trusts in the Release file. The option names are
// APT::FTPArchive::<Index>::<Checksum>, where the checksum is MD5 rather than MD5Sum —
// a wrong key here is silently ignored, so verify by reading the generated Release.
APT::FTPArchive::Release::MD5 "false";
APT::FTPArchive::Release::SHA1 "false";
APT::FTPArchive::Release::SHA256 "true";
APT::FTPArchive::Release::SHA512 "true";
